site_name: Delta X Robot
site_url: https://docs.deltaxrobot.com/
# Preserve published /path/ and /path/index.html URLs when changing the theme.
use_directory_urls: true
site_description: Guides, G-code references, and technical specifications for Delta X robots and accessories.
hooks:
    - hooks/docs.py
copyright: Copyright &copy; 2021 <a href="https://deltaxrobot.com">IMWI Technology</a>
markdown_extensions:
    - md_in_html
    - smarty
    - toc:
        permalink: True
    - sane_lists
    - admonition

repo_name: GitHub
repo_url: https://github.com/deltaxrobot/Delta-X-Docs
nav:
    - Home: index.md
    - References:
        - G-code Commands:
            - Useful Commands: reference/gcodes/useful_commands.md
            - Delta X 1: reference/gcodes/gc_x1.md
            - Delta X 2: reference/gcodes/gc_x2.md
            - Delta X 2 Plus: reference/gcodes/gc_x2_plus.md
            - Delta X 3:
                - "Firmware < 2.0.0": reference/gcodes/gc_x3.md
                - "Firmware > 2.0.0": reference/gcodes/gc_x3_v2.md
            - Delta X S V4: reference/gcodes/gc_xs_v4.md
            - Delta X S V5: reference/gcodes/gc_xs_v5.md
            - Short Conveyor: reference/gcodes/gc_short_conveyor.md
            - Desktop Conveyor: reference/gcodes/gc_conveyor.md
            - XConveyor XEncoder: reference/gcodes/gc_industrial_conveyor.md
            - Slider X: reference/gcodes/gc_slider.md
        # Temporarily hidden; keep for future use.
        # - Macro Programming:
        #     - Macro Programming: reference/macro_programming/macro_programming.md
        - Specifications: 
            - Delta X 1: reference/specifications/sp_x1.md
            - Delta X 2: reference/specifications/sp_x2.md
            - Delta X 2 Plus: reference/specifications/sp_x2_plus.md
            - Delta X S V4: 
                - D400: reference/specifications/delta_xs_v4/sp_v4_d400.md
                - D600: reference/specifications/delta_xs_v4/sp_v4_d600.md
                - D800: reference/specifications/delta_xs_v4/sp_v4_d800.md
            - Delta X S V5: 
                - D400: reference/specifications/delta_xs_v5/sp_v5_d400.md
                - D600: reference/specifications/delta_xs_v5/sp_v5_d600.md
                - D800: reference/specifications/delta_xs_v5/sp_v5_d800.md
            - Accessories:
                - Delta X 2 Accessories: 
                    - Short Conveyor: reference/specifications/accessories/delta_x2_accessories/conveyor_x.md
                    - Slider X: reference/specifications/accessories/delta_x2_accessories/slider_x.md
                    - Vision Kit V1: reference/specifications/accessories/delta_x2_accessories/vision_kit_v1.md
                    - 2020 Aluminum Profile Frames:
                        - Hyper Cube Frame 2020 Basic Kit: reference/specifications/accessories/delta_x2_accessories/frames/hyper_cube_frame_2020_basic.md
                - Delta X S Accessories:
                    - X Conveyor D120/200/300/400 L1200: reference/specifications/accessories/delta_xs_accessories/industrial_conveyor_belts.md
    - Tutorials:
        - Tutorial List:  tutorials/tutorials_list.md
        - Assembly Guides:
            - Delta X 2: tutorials/assembly_guides/x2_assembly_guide.md
            - Delta X S Robot: tutorials/assembly_guides/xs_assembly_guide.md
            - Delta X S Frame: tutorials/assembly_guides/xs_frame_assembly_guide.md
            - Delta X S IO Wiring: tutorials/assembly_guides/xs_v5_wiring_tutorial.md
        - Control Guides:
            - Termite (X3 & XS): tutorials/control_guides/termite.md
            - Delta X 2: tutorials/control_guides/control_delta_x2_by_arduino.md
            - DeltaXStudio:
                - Overview: tutorials/control_guides/deltaxstudio/overview.md
                - Pick & Place Setup:
                    - 1. System Setup: tutorials/control_guides/deltaxstudio.md
                    - 2. Calibration:
                        - Choose a method: tutorials/control_guides/deltaxstudio/calibration.md
                        - Static calibration: tutorials/control_guides/deltaxstudio/calibration/static.md
                        - Fully automatic: tutorials/control_guides/deltaxstudio/calibration/automatic.md
                        - Controlled conveyor · Manual points: tutorials/control_guides/deltaxstudio/calibration/controlled-conveyor.md
                        - External conveyor · Camera: tutorials/control_guides/deltaxstudio/calibration/external-camera.md
                        - External conveyor · Manual points: tutorials/control_guides/deltaxstudio/calibration/external-manual.md
                    - 3. Vision:
                        - Choose a method: tutorials/control_guides/deltaxstudio/vision.md
                        - AI: tutorials/control_guides/deltaxstudio/vision/ai.md
                        - Color filtering: tutorials/control_guides/deltaxstudio/vision/color.md
                        - AI + Template Matching: tutorials/control_guides/deltaxstudio/vision/ai-template.md
                        - Color + Template Matching: tutorials/control_guides/deltaxstudio/vision/color-template.md
                    - 4. Pick & Place: tutorials/control_guides/deltaxstudio/pick_and_place.md
                - Blockly Programming:
                    - Getting started: tutorials/control_guides/deltaxstudio/blockly.md
                    - Movement examples:
                        - Stationary pick & place: tutorials/control_guides/deltaxstudio/blockly/stationary-pick-and-place.md
                        - Conveyor pick & place (AI): tutorials/control_guides/deltaxstudio/blockly/conveyor-pick-and-place.md
                        - Color filtering + pick & place: tutorials/control_guides/deltaxstudio/blockly/color-pick-and-place.md
                        - Sort two object types (AI): tutorials/control_guides/deltaxstudio/blockly/sort-two-types.md
                    - Vision-only examples:
                        - Color filtering: tutorials/control_guides/deltaxstudio/blockly/color-filtering.md
                        - Color + Template Matching: tutorials/control_guides/deltaxstudio/blockly/color-template-matching.md
                - Daily Operation: tutorials/control_guides/deltaxstudio/daily_operation.md
        - Applications:
            - Delta X Drawing: tutorials/application_guides/deltax_art.md
