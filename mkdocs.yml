    #     - Delta X 1 Series:
    #         - Delta X 1 Basic Kit: products/deltax1/x1_basic_kit.md
    #         - Delta X 1 Luxury Kit: products/deltax1/x1_luxury_kit.md
    #         - Delta X 1 Develop Kit: products/deltax1/x1_dev_kit.md
    #     - Delta X 2 Series:
    #         - Delta X 2 Basic Kit: products/deltax2/deltax2_basic_kit.md
    #         - Delta X 2 Pick & Place Kit: products/deltax2/deltax2_pick_and_place_kit.md
    #         - Delta X 2 Develop Kit: products/deltax2/deltax2_dev_kit.md
    #     - Delta X S Series:
    #         - Delta X S D400: products/deltaxs/deltaxs_d400.md
    #         - Delta X S D600: products/deltaxs/deltaxs_d600.md
    #         - Delta X S D800: products/deltaxs/deltaxs_d800.md
theme:
    name: readthedocs
    custom_dir: theme
    analytics: null
    navigation_depth: 5
    sticky_navigation: false
    collapse_navigation: false
# Keep archived pages reachable at their original URLs. Macro Programming stays
# out of navigation and the custom search index (see ARCHIVED_PAGES in hooks/docs.py).
# To restore it, remove that search exclusion and uncomment its navigation/home links.
not_in_nav: |
    reference/gcodes/gc_encoder.md
    reference/macro_programming/macro_programming.md
    products/
    reference/specifications/accessories/delta_x2_accessories/frames/hyper_cube_frame_2020_dev.md
    reference/specifications/accessories/delta_xs_accessories/frames/on_table_frames.md
    reference/specifications/accessories/delta_xs_accessories/frames/stand_frames.md
    reference/specifications/accessories/delta_xs_accessories/industrial_vision_system_kit.md
    
