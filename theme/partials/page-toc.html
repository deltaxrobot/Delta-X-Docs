{% for top in page.toc %}
  {% for item in top.children %}
    {% set grouped = item.title in (page.meta.command_groups or []) %}
    <a href="{{ item.url }}"{% if grouped %} class="toc-group"{% endif %}>{{ item.title }}</a>
    {% if grouped %}
    <div class="toc-children">
      {% for child in item.children %}<a href="{{ child.url }}">{{ child.title }}</a>{% endfor %}
    </div>
    {% endif %}
  {% endfor %}
{% endfor %}
